<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">What parents needed from Bonti</title>
  <desc id="desc">Three research themes: clear guidance, less choice overload, and practical everyday use.</desc>
  <rect width="1200" height="720" rx="38" fill="#f9f4ea"/>
  <text x="80" y="100" fill="#191817" font-family="Arial, sans-serif" font-size="23" letter-spacing="3">RESEARCH SYNTHESIS</text>
  <text x="80" y="165" fill="#191817" font-family="Georgia, serif" font-size="54">What makes a day feel easier?</text>
  <path d="M80 205H1120" stroke="#d9d0c3" stroke-width="2"/>
  <g transform="translate(80 258)">
    <rect width="320" height="370" rx="26" fill="#fff"/>
    <circle cx="54" cy="58" r="28" fill="#e9e2d6"/>
    <path d="M43 58l8 8 16-18" fill="none" stroke="#4c493f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="133" fill="#191817" font-family="Arial, sans-serif" font-size="22" font-weight="700">Clarity</text>
    <text x="36" y="184" fill="#55514c" font-family="Arial, sans-serif" font-size="18"><tspan x="36" dy="0">Parents needed clarity on</tspan><tspan x="36" dy="28">what was worth buying.</tspan></text>
    <text x="36" y="322" fill="#82796e" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">LESS GUESSWORK</text>
  </g>
  <g transform="translate(440 258)">
    <rect width="320" height="370" rx="26" fill="#fff"/>
    <circle cx="54" cy="58" r="28" fill="#e9e2d6"/>
    <path d="M41 54h26M41 64h18" fill="none" stroke="#4c493f" stroke-width="4" stroke-linecap="round"/>
    <text x="36" y="133" fill="#191817" font-family="Arial, sans-serif" font-size="22" font-weight="700">Less overwhelm</text>
    <text x="36" y="184" fill="#55514c" font-family="Arial, sans-serif" font-size="18"><tspan x="36" dy="0">More products and paid</tspan><tspan x="36" dy="28">membership were rejected.</tspan></text>
    <text x="36" y="322" fill="#82796e" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">FEWER, BETTER CHOICES</text>
  </g>
  <g transform="translate(800 258)">
    <rect width="320" height="370" rx="26" fill="#fff"/>
    <circle cx="54" cy="58" r="28" fill="#e9e2d6"/>
    <path d="M44 47h20v23H44zM49 43h10" fill="none" stroke="#4c493f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="133" fill="#191817" font-family="Arial, sans-serif" font-size="21" font-weight="700">Everyday practicality</text>
    <text x="36" y="184" fill="#55514c" font-family="Arial, sans-serif" font-size="18"><tspan x="36" dy="0">Packing the stroller added</tspan><tspan x="36" dy="28">daily friction.</tspan></text>
    <text x="36" y="322" fill="#82796e" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">READY TO MOVE</text>
  </g>
</svg>
